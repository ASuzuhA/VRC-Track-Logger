<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VRChat Track Logger</title>
    <style>
        :root {
            --bg-color: #f4f7f6;
            --text-main: #2c3e50;
            --text-sub: #7f8c8d;
            --timeline-line: #dcdfe6;
            --card-bg: #ffffff;
            --accent: #3498db;
            --ev-world: #e67e22;
            --ev-status: #27ae60;
            --ev-avatar: #9b59b6;
            --ev-bio: #e74c3c;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        header h1 {
            font-size: 2.2rem;
            font-weight: 400;
            letter-spacing: 2px;
        }

        .subtitle {
            color: var(--text-sub);
            font-size: 0.95rem;
            margin-top: 5px;
        }

        .status-bar {
            margin-top: 10px;
            font-size: 0.85rem;
            color: var(--text-sub);
        }

        .timeline {
            position: relative;
            padding: 20px 0;
        }

        @media (min-width: 768px) {
            .timeline::before {
                content: '';
                position: absolute;
                top: 0;
                left: 120px;
                height: 100%;
                width: 2px;
                background-color: var(--timeline-line);
            }
        }

        .date-group {
            margin-bottom: 40px;
            position: relative;
        }

        .date-title {
            margin-bottom: 20px;
        }

        @media (min-width: 768px) {
            .date-title {
                width: 120px;
                text-align: right;
                padding-right: 25px;
                position: relative;
            }
            .date-title::after {
                content: '';
                position: absolute;
                right: -6px;
                top: 50%;
                transform: translateY(-50%);
                width: 10px;
                height: 10px;
                background-color: var(--accent);
                border-radius: 50%;
            }
        }

        .date-title span {
            background-color: var(--accent);
            color: white;
            padding: 4px 12px;
            border-radius: 15px;
            font-size: 0.9rem;
            font-weight: bold;
        }

        .events-container {
            position: relative;
        }

        @media (min-width: 768px) {
            .events-container {
                padding-left: 160px;
            }
        }

        .event-item {
            background-color: var(--card-bg);
            padding: 16px 20px;
            margin-bottom: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            border-left: 4px solid var(--timeline-line);
            position: relative;
        }

        @media (min-width: 768px) {
            .event-item::before {
                content: '';
                position: absolute;
                top: 22px;
                left: -40px;
                width: 36px;
                height: 2px;
                background-color: var(--timeline-line);
            }
        }

        .event-item.ev-world { border-left-color: var(--ev-world); }
        .event-item.ev-status { border-left-color: var(--ev-status); }
        .event-item.ev-avatar { border-left-color: var(--ev-avatar); }
        .event-item.ev-bio { border-left-color: var(--ev-bio); }

        .ev-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            padding-bottom: 6px;
            border-bottom: 1px dashed #eee;
        }

        .ev-time {
            font-size: 1rem;
            font-weight: bold;
            font-family: monospace;
        }

        .ev-type-tag {
            font-size: 0.75rem;
            color: var(--text-sub);
            background: #f0f2f5;
            padding: 2px 8px;
            border-radius: 4px;
        }

        .sub-event-row {
            margin-top: 6px;
            font-size: 0.95rem;
        }

        .world-name strong {
            color: #1a1a1a;
        }

        .world-duration {
            font-size: 0.85rem;
            color: var(--text-sub);
            margin-top: 2px;
        }

        .status-text {
            color: #27ae60;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Track Logger</h1>
            <p class="subtitle">VRChat 玩家活动时间轨迹</p>
            <div class="status-bar">
                <span id="data-status">正在获取数据...</span>
            </div>
        </header>

        <div class="timeline" id="timeline-container"></div>
    </div>

    <script>
        const eventMeta = {
            'world_change':  { icon: '📍', label: '房间', tagClass: 'ev-world' },
            'status_change': { icon: '💬', label: '状态', tagClass: 'ev-status' },
            'avatar_change': { icon: '👗', label: '模型', tagClass: 'ev-avatar' },
            'bio_change':    { icon: '📝', label: '简介', tagClass: 'ev-bio' }
        };

        // 核心合并算法
        function groupEventsByTime(timelineArray) {
            const timeMap = new Map();
            timelineArray.forEach(item => {
                const timeKey = item.time;
                if (!timeMap.has(timeKey)) {
                    timeMap.set(timeKey, []);
                }
                timeMap.get(timeKey).push(item);
            });
            return Array.from(timeMap.entries()).map(([time, events]) => ({ time, events }));
        }

        async function fetchAndRenderTimeline() {
            const container = document.getElementById('timeline-container');
            const statusNode = document.getElementById('data-status');

            try {
                // 加上时间戳防止 GitHub Pages/浏览器 CDN 强缓存 data.json
                const response = await fetch(`data.json?t=${Date.now()}`);
                if (!response.ok) throw new Error(`HTTP Error ${response.status}`);
                
                const rawData = await response.json();

                if (!rawData || rawData.length === 0) {
                    statusNode.textContent = '暂无轨迹数据';
                    return;
                }

                const now = new Date().toLocaleTimeString();
                statusNode.textContent = `最后更新时间: ${now} (自动轮询中)`;
                container.innerHTML = '';

                // 日期倒序（最新的天在最上面）
                const reversedRawData = [...rawData].reverse();

                reversedRawData.forEach(dayData => {
                    const dateGroupNode = document.createElement('div');
                    dateGroupNode.className = 'date-group';

                    const dateTitleNode = document.createElement('div');
                    dateTitleNode.className = 'date-title';
                    dateTitleNode.innerHTML = `<span>${dayData.date}</span>`;
                    dateGroupNode.appendChild(dateTitleNode);

                    const eventsContainerNode = document.createElement('div');
                    eventsContainerNode.className = 'events-container';

                    // 时间组倒序（最新的时间点在最上面）
                    const groupedTimeline = groupEventsByTime(dayData.timeline).reverse();

                    groupedTimeline.forEach(timeBlock => {
                        const eventNode = document.createElement('div');
                        const primaryType = timeBlock.events[0].event_type;
                        const cardBorderClass = eventMeta[primaryType] ? eventMeta[primaryType].tagClass : '';
                        eventNode.className = `event-item ${cardBorderClass}`;

                        let innerHtml = `
                            <div class="ev-meta">
                                <span class="ev-time">${timeBlock.time}</span>
                                <div class="ev-tags">
                        `;

                        timeBlock.events.forEach(e => {
                            const meta = eventMeta[e.event_type] || { icon: '📌', label: '记录' };
                            innerHtml += `<span class="ev-type-tag">${meta.icon} ${meta.label}</span> `;
                        });

                        innerHtml += `
                                </div>
                            </div>
                            <div class="ev-content">
                        `;

                        timeBlock.events.forEach(e => {
                            innerHtml += `<div class="sub-event-row">`;
                            switch (e.event_type) {
                                case 'world_change':
                                    innerHtml += `
                                        <p class="world-name">移动至房间: <strong>${e.world}</strong></p>
                                        <p class="world-duration">⏱️ 停留时长: ${e.duration}</p>
                                    `;
                                    break;
                                case 'status_change':
                                    innerHtml += `<p class="status-text">${e.action}</p>`;
                                    break;
                                default:
                                    innerHtml += `<p>${e.action || ''}</p>`;
                            }
                            innerHtml += `</div>`;
                        });

                        innerHtml += `</div>`;
                        eventNode.innerHTML = innerHtml;
                        eventsContainerNode.appendChild(eventNode);
                    });

                    dateGroupNode.appendChild(eventsContainerNode);
                    container.appendChild(dateGroupNode);
                });

            } catch (err) {
                console.error(err);
                statusNode.textContent = `❌ 数据加载异常: ${err.message}`;
            }
        }

        // 1. 页面加载完成后立即拉取一次
        window.onload = () => {
            fetchAndRenderTimeline();
            // 2. 开启前端轮询（默认每 30 秒自动拉取最新 data.json，无需刷网页）
            setInterval(fetchAndRenderTimeline, 30000);
        };
    </script>
</body>
</html>
